<!DOCTYPE HTML>
<html>
<head>
    <title>Phase 1: Runtime Analysis Test Page</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #tv_chart_container {
            width: 100%;
            height: 600px;
        }
        #status {
            padding: 10px;
            background: #f0f0f0;
            border-bottom: 1px solid #ccc;
            font-size: 12px;
        }
        .status-ok { color: green; }
        .status-error { color: red; }
    </style>

    <!-- CRITICAL: Load hook BEFORE the charting library -->
    <script type="text/javascript" src="hook-injection-simple.js"></script>
    
    <!-- Load the charting library from local path -->
    <script type="text/javascript" src="../../charting_library/charting_library.standalone.js"></script>

    <script type="text/javascript">
        // Mock Datafeed - EXACT implementation with proper OHLCV data
        class MockDatafeed {
            constructor() {
                this.subscribers = {};
                this.lastBar = null;
            }
            
            onReady(callback) {
                setTimeout(() => callback({
                    supported_resolutions: ["1", "5", "15", "30", "60", "240", "1D", "1W", "1M"],
                    currency_codes: ["USD"],
                    units: { "AAPL": "shares", "MSFT": "shares" }
                }), 0);
            }
            
            resolveSymbol(symbolName, onResolve, onError) {
                setTimeout(() => {
                    onResolve({
                        name: symbolName,
                        full_name: symbolName,
                        ticker: symbolName,
                        description: symbolName + " Mock Data",
                        type: "stock",
                        session: "0900-1600",
                        exchange: "MOCK",
                        listed_exchange: "MOCK",
                        timezone: "America/New_York",
                        pricescale: 100,
                        minmov: 1,
                        minmov2: 0,
                        fractional: false,
                        has_intraday: true,
                        intraday_multipliers: ["1", "5", "15", "30", "60", "240"],
                        supported_resolutions: ["1", "5", "15", "30", "60", "240", "1D", "1W", "1M"],
                        has_daily: true,
                        has_weekly_and_monthly: true,
                        has_empty_bars: false,
                        force_session_rebuild: true,
                        has_no_volume: false,
                        volume_precision: 0,
                        data_status: "streaming",
                        expired: false
                    });
                }, 0);
            }
            
            getBars(symbolInfo, resolution, from, to, onHistoryCallback, onError, firstDataRequest) {
                const bars = [];
                const rangeDays = Math.ceil((to - from) / 86400);
                const points = Math.min(rangeDays, 300); // Cap at 300 bars
                
                let basePrice = 150.0;
                let time = from * 1000;
                const intervalMs = this._resolutionToMs(resolution);
                
                for (let i = 0; i < points; i++) {
                    const open = basePrice + (Math.random() - 0.5) * 2;
                    const close = open + (Math.random() - 0.5) * 3;
                    const high = Math.max(open, close) + Math.random() * 1.5;
                    const low = Math.min(open, close) - Math.random() * 1.5;
                    const volume = Math.floor(Math.random() * 1000000) + 500000;
                    
                    bars.push({
                        time: Math.floor(time / 1000),
                        open: parseFloat(open.toFixed(2)),
                        high: parseFloat(high.toFixed(2)),
                        low: parseFloat(low.toFixed(2)),
                        close: parseFloat(close.toFixed(2)),
                        volume: volume
                    });
                    
                    basePrice = close;
                    time += intervalMs;
                }
                
                this.lastBar = bars[bars.length - 1];
                
                setTimeout(() => {
                    onHistoryCallback(bars, { noData: false, nextTime: false });
                }, 100);
            }
            
            subscribeBars(symbolInfo, resolution, onRealtimeCallback, subscriberUID, onResetCacheNeededCallback) {
                this.subscribers[subscriberUID] = {
                    symbolInfo, resolution, onRealtimeCallback
                };
                
                // Simulate a tick every 5 seconds
                const interval = setInterval(() => {
                    if (!this.lastBar) return;
                    
                    const last = this.lastBar;
                    const change = (Math.random() - 0.5) * 0.5;
                    const newClose = Math.max(last.low, Math.min(last.high, last.close + change));
                    
                    const newBar = {
                        time: last.time,
                        open: last.open,
                        high: Math.max(last.high, newClose),
                        low: Math.min(last.low, newClose),
                        close: parseFloat(newClose.toFixed(2)),
                        volume: last.volume + Math.floor(Math.random() * 1000)
                    };
                    
                    this.lastBar = newBar;
                    onRealtimeCallback(newBar);
                }, 5000);
                
                return () => clearInterval(interval);
            }
            
            unsubscribeBars(subscriberUID) {
                delete this.subscribers[subscriberUID];
            }
            
            _resolutionToMs(resolution) {
                if (resolution.endsWith('D')) return 86400000;
                if (resolution.endsWith('W')) return 604800000;
                if (resolution.endsWith('M')) return 2592000000;
                return parseInt(resolution) * 60000;
            }
        }

        // Initialize widget when DOM is ready
        function initWidget() {
            console.log('[Test Page] Initializing widget...');
            
            var statusEl = document.getElementById('status');
            
            try {
                var widget = window.tvWidget = new TradingView.widget({
                    debug: true,
                    fullscreen: false,
                    width: '100%',
                    height: 600,
                    symbol: 'AAPL',
                    interval: '1D',
                    container: "tv_chart_container",
                    datafeed: new MockDatafeed(),
                    library_path: "../../charting_library/",
                    locale: "en",
                    disabled_features: [
                        "use_localstorage_for_settings",
                        "study_templates",
                        "header_screenshot",
                        "header_symbol_search",
                        "header_compare",
                        "header_saveload"
                    ],
                    enabled_features: [],
                    charts_storage_url: '',
                    charts_storage_api_version: "",
                    client_id: '',
                    user_id: '',
                    theme: 'light'
                });

                statusEl.innerHTML = '<span class="status-ok">✓ Widget initialization started</span>';
                console.log('[Test Page] Widget object created:', widget);
            } catch (error) {
                statusEl.innerHTML = '<span class="status-error">✗ Error: ' + error.message + '</span>';
                console.error('[Test Page] Initialization error:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', initWidget, false);
    </script>
</head>

<body>
    <div id="status">Initializing...</div>
    <div id="tv_chart_container"></div>
</body>

</html>
