<!DOCTYPE HTML>
<html>
<head>
    <title>Phase 1: Minimal Datafeed Test</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
    <style>
        body { margin: 0; padding: 10px; font-family: Arial; }
        #status { padding: 10px; background: #f0f0f0; margin-bottom: 10px; }
        #tv_chart_container { width: 100%; height: 600px; }
        .error { color: red; }
        .ok { color: green; }
    </style>

    <!-- CRITICAL: Load hook FIRST -->
    <script type="text/javascript" src="hook-injection-simple.js"></script>
    
    <!-- Load charting library -->
    <script type="text/javascript" src="../../charting_library/charting_library.standalone.js"></script>

    <script type="text/javascript">
        // Minimal Datafeed - BARE MINIMUM UDF compliance
        class MinimalDatafeed {
            onReady(callback) {
                callback({
                    supported_resolutions: ['1D']
                });
            }
            
            resolveSymbol(symbolName, onResolve, onError) {
                onResolve({
                    name: symbolName,
                    ticker: symbolName,
                    type: 'stock',
                    exchange: 'MOCK',
                    listed_exchange: 'MOCK',
                    timezone: 'America/New_York',
                    pricescale: 100,
                    minmov: 1,
                    minmov2: 0,
                    has_intraday: false,
                    has_daily: true,
                    has_weekly_and_monthly: false,
                    supported_resolutions: ['1D'],
                    data_status: 'streaming',
                    volume_precision: 0
                });
            }
            
            getBars(symbolInfo, resolution, from, to, onHistoryCallback, onError, firstDataRequest) {
                // Generate exactly 5 bars for testing
                const bars = [];
                let time = from;
                let price = 100;
                
                for (let i = 0; i < 5; i++) {
                    const open = price;
                    const close = price + (Math.random() - 0.5) * 4;
                    const high = Math.max(open, close) + 1;
                    const low = Math.min(open, close) - 1;
                    
                    bars.push({
                        time: time,
                        open: open,
                        high: high,
                        low: low,
                        close: close,
                        volume: 1000000
                    });
                    
                    time += 86400;  // Next day
                    price = close;
                }
                
                setTimeout(() => {
                    onHistoryCallback(bars);
                }, 100);
            }
            
            subscribeBars(symbolInfo, resolution, onRealtimeCallback, subscriberUID, onResetCacheNeededCallback) {
                // Don't generate realtime updates for now - just subscribe
                return () => {};
            }
            
            unsubscribeBars(subscriberUID) {
            }
        }

        function initWidget() {
            const statusEl = document.getElementById('status');
            
            try {
                window.tvWidget = new TradingView.widget({
                    fullscreen: false,
                    width: '100%',
                    height: 600,
                    symbol: 'TEST',
                    interval: '1D',
                    container: 'tv_chart_container',
                    datafeed: new MinimalDatafeed(),
                    library_path: '../../charting_library/',
                    locale: 'en',
                    theme: 'light'
                });
                
                statusEl.innerHTML = '<span class="ok">✓ Widget initialized, waiting for data...</span>';
                
                // Subscribe to data loaded event
                setTimeout(() => {
                    try {
                        const chart = window.tvWidget.activeChart();
                        const dataReady = chart.dataReady();
                        statusEl.innerHTML = '<span class="ok">✓ Data ready: ' + dataReady + ' | Chart exists</span>';
                        
                        // Subscribe to data loaded
                        chart.onDataLoaded().subscribe(null, () => {
                            statusEl.innerHTML = '<span class="ok">✓ Data loaded event fired</span>';
                        });
                    } catch (err) {
                        statusEl.innerHTML = '<span class="error">✗ ' + err.message + '</span>';
                    }
                }, 500);
            } catch (error) {
                statusEl.innerHTML = '<span class="error">✗ ' + error.message + '</span>';
            }
        }

        window.addEventListener('DOMContentLoaded', initWidget);
    </script>
</head>

<body>
    <div id="status">Initializing...</div>
    <div id="tv_chart_container"></div>
</body>

</html>
