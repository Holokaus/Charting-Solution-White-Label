<!DOCTYPE HTML>
<html>
<head>
    <title>Phase 1: Feature Trigger Test Page</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #tv_chart_container {
            width: 100%;
            height: 600px;
        }
        #controls {
            padding: 10px;
            background: #f0f0f0;
            border-bottom: 1px solid #ccc;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
        }
        #status {
            padding: 10px;
            background: #e0e0e0;
            border-bottom: 1px solid #ccc;
            font-size: 12px;
        }
        .status-ok { color: green; }
        status-error { color: red; }
    </style>

    <!-- CRITICAL: Load hook FIRST, BEFORE the charting library -->
    <script type="text/javascript" src="hook-injection-simple.js"></script>

    <!-- Load the charting library from local path -->
    <script type="text/javascript" src="../../charting_library/charting_library.standalone.js"></script>
    
    <!-- Load UDF Datafeed from TradingView -->
    <script type="text/javascript" src="../../datafeeds/udf/dist/bundle.js"></script>

    <script type="text/javascript">
        // Use TradingView's default UDF datafeed with demo data
        
        // Initialize widget when DOM is ready
        function initWidget() {
            console.log('[Test Page] Initializing widget...');
            
            var statusEl = document.getElementById('status');
            
            try {
                var widget = window.tvWidget = new TradingView.widget({
                    debug: true,
                    fullscreen: false,
                    width: '100%',
                    height: 600,
                    symbol: 'AAPL',
                    interval: '1D',
                    container: "tv_chart_container",
                    datafeed: new Datafeeds.UDFCompatibleDatafeed('https://demo-feed-data.tradingview.com', undefined, {
                        maxResponseLength: 1000,
                        expectedOrder: 'latestFirst',
                    }),
                    library_path: "../../charting_library/",
                    locale: "en",
                    disabled_features: [
                        "use_localstorage_for_settings",
                        "study_templates",
                        "header_screenshot",
                        "header_symbol_search",
                        "header_compare",
                        "header_saveload"
                    ],
                    enabled_features: [],
                    charts_storage_url: '',
                    charts_storage_api_version: "",
                    client_id: '',
                    user_id: '',
                    theme: 'light'
                });

                statusEl.innerHTML = '<span class="status-ok">✓ Widget initialization started</span>';
                console.log('[Test Page] Widget object created:', widget);
            } catch (error) {
                statusEl.innerHTML = '<span class="status-error">✗ Error: ' + error.message + '</span>';
                console.error('[Test Page] Initialization error:', error);
            }
        }

        // Feature trigger functions
        function triggerSymbolChange() {
            window.startFeatureTracking('change_symbol');
            if (window.tvWidget) {
                window.tvWidget.setSymbol('MSFT', '1D');
            }
            setTimeout(window.endFeatureTracking, 1000);
        }

        function triggerIntervalChange() {
            window.startFeatureTracking('change_interval');
            if (window.tvWidget && window.tvWidget.chart) {
                window.tvWidget.chart().setResolution('5', function() {});
            }
            setTimeout(window.endFeatureTracking, 1000);
        }

        function triggerThemeChange() {
            window.startFeatureTracking('change_theme');
            if (window.tvWidget) {
                window.tvWidget.changeTheme('dark');
            }
            setTimeout(window.endFeatureTracking, 1000);
        }

        function triggerChartTypeChange() {
            window.startFeatureTracking('change_chart_type');
            if (window.tvWidget && window.tvWidget.chart) {
                window.tvWidget.chart().setChartType(3); // 3 = line chart
            }
            setTimeout(window.endFeatureTracking, 1000);
        }

        function triggerTimeScaleScroll() {
            window.startFeatureTracking('time_scale_scroll');
            if (window.tvWidget) {
                window.tvWidget.chart().scrollToPosition(50, 0);
            }
            setTimeout(window.endFeatureTracking, 1000);
        }

        function triggerFitContent() {
            window.startFeatureTracking('fit_content');
            if (window.tvWidget) {
                window.tvWidget.chart().resetDataScale();
            }
            setTimeout(window.endFeatureTracking, 1000);
        }

        function triggerExportLogs() {
            window.exportHookLogs();
        }

        function triggerExportModuleMap() {
            window.exportModuleBehaviorMap();
        }

        window.addEventListener('DOMContentLoaded', initWidget, false);
    </script>
</head>

<body>
    <div id="status">Initializing...</div>
    <div id="controls">
        <button onclick="triggerSymbolChange()">Change Symbol</button>
        <button onclick="triggerIntervalChange()">Change Interval</button>
        <button onclick="triggerThemeChange()">Change Theme</button>
        <button onclick="triggerChartTypeChange()">Change Chart Type</button>
        <button onclick="triggerTimeScaleScroll()">Time Scale Scroll</button>
        <button onclick="triggerFitContent()">Fit Content</button>
        <button onclick="triggerExportLogs()">Export Logs</button>
        <button onclick="triggerExportModuleMap()">Export Module Map</button>
    </div>
    <div id="tv_chart_container"></div>
</body>

</html>
